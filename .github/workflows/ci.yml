name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Scan diff for secrets
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No usable base SHA, scanning full history instead"
            ./gitleaks detect --source=. --redact --no-banner
          else
            ./gitleaks detect --source=. --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --no-banner
          fi

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for unapproved binary files
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.sha }}"
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No usable base SHA; cannot audit the diff for new binary files. Failing closed."
            exit 1
          fi

          violations=()
          while IFS=$'\t' read -r added removed path; do
            [ "$added" = "-" ] && [ "$removed" = "-" ] || continue
            allowed=false
            while IFS= read -r pattern; do
              case "$pattern" in ''|'#'*) continue ;; esac
              case "$path" in $pattern) allowed=true; break ;; esac
            done < .github/binary-allowlist.txt
            if [ "$allowed" = false ]; then
              violations+=("$path")
            fi
          done < <(git diff --diff-filter=ACMR --numstat "${BASE_SHA}...${HEAD_SHA}")

          if [ "${#violations[@]}" -gt 0 ]; then
            echo "Binary file(s) outside .github/binary-allowlist.txt were added or changed in this diff:"
            printf '  %s\n' "${violations[@]}"
            echo
            echo "Fix by either:"
            echo "  1. Removing the binary file(s) above from this PR, or"
            echo "  2. Adding their path(s) to .github/binary-allowlist.txt in this same PR,"
            echo "     so the allowlist change is visible on review."
            exit 1
          fi

          echo "No unapproved binary files in diff."

      - name: Verify committed font binaries match the pinned manifest
        run: |
          grep -E 'src/assets/fonts/.*\.woff2$' src/assets/fonts/SOURCES.sha256 | sha256sum -c -

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit prod dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Install OSV-Scanner
        run: |
          curl -sSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      - name: OSV scan
        run: ./osv-scanner scan source --lockfile=package-lock.json

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: No unexpected inline scripts in build
        run: |
          # Exactly one inline script is allowed: the theme bootstrap that sets
          # data-theme before first paint (design spec acceptance criterion 2,
          # docs/ARCHITECTURE.md section 6). It must carry data-theme-bootstrap so
          # that it is visible both in review and here. Anything else inline fails.
          inline=$(grep -o '<script[^>]*>' dist/index.html | grep -v ' src=' | wc -l)
          tagged=$(grep -o '<script[^>]*>' dist/index.html | grep -v ' src=' | grep -c 'data-theme-bootstrap' || true)
          if [ "$inline" -ne "$tagged" ]; then
            echo "Unexpected inline <script> in dist/index.html: $inline inline, $tagged tagged data-theme-bootstrap"
            echo 'Inline script breaks CSP script-src self. Tag the theme bootstrap, or move the code into the bundle.'
            exit 1
          fi
          if [ "$tagged" -gt 1 ]; then
            echo "Found $tagged data-theme-bootstrap scripts; there must be exactly one"
            exit 1
          fi

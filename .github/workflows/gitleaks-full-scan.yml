name: Gitleaks full history scan

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks

      - name: Scan full git history for secrets
        run: ./gitleaks detect --source=. --redact --no-banner
